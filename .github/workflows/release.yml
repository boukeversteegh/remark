name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/test-newmodel.js
      - run: node tests/test-fence.js
      - run: node tests/test-interject.js

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            out: remark-windows-amd64.exe
            ldflags: "-H windowsgui -s -w"
          - goos: linux
            goarch: amd64
            out: remark-linux-amd64
            ldflags: "-s -w"
          - goos: linux
            goarch: arm64
            out: remark-linux-arm64
            ldflags: "-s -w"
          - goos: darwin
            goarch: amd64
            out: remark-macos-amd64
            ldflags: "-s -w"
          - goos: darwin
            goarch: arm64
            out: remark-macos-arm64
            ldflags: "-s -w"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "${{ matrix.ldflags }}" -o ${{ matrix.out }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
