<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remark</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230969da' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4'/%3E%3Cpath d='M2 6h4'/%3E%3Cpath d='M2 10h4'/%3E%3Cpath d='M2 14h4'/%3E%3Cpath d='M2 18h4'/%3E%3Cpath d='M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- splash: instant, fixed-size, centered; masks load + first render and
     fades out once app.js has painted -->
<div id="splash">
  <div class="scard">
    <span class="smark"></span>
    <span class="sname">remark</span>
  </div>
</div>
<header id="topbar">
  <div class="brand" title="remark"><span class="brandmark" id="brandmark"></span></div>
  <button id="outlineBtn" class="iconbtn" title="Toggle outline panel"></button>
  <button id="openBtn" class="iconbtn" title="Open a markdown file…"></button>
  <div id="filename" title=""></div>
  <div class="spacer"></div>
  <button id="unreadBtn" class="pill unread-pill hidden" title="Jump to the next unread comment"></button>
  <button id="focusModeBtn" class="iconbtn" title="Single-thread view"></button>
  <div class="seg" id="modeSeg">
    <button data-mode="inline" title="Comments in the document flow"></button>
    <button data-mode="margin" title="Comments in a side margin, like Word review"></button>
  </div>
  <div class="tools">
    <button id="hideResolvedBtn" class="iconbtn" title="Hide resolved threads"></button>
    <button id="collapseAll" class="iconbtn" title="Collapse all threads"></button>
    <button id="expandAll" class="iconbtn" title="Expand all threads"></button>
    <button id="openWithBtn" class="iconbtn" title="Open in another app…"></button>
    <button id="gatewayBtn" class="iconbtn" title="Gateway — put this document on your phone"></button>
  </div>
  <label class="me" title="Comments you write are signed with this name">as<input id="meInput" size="9" spellcheck="false"></label>
  <div id="status" class="statuschip"></div>
  <!-- caption buttons: only shown inside the native window, where the host
       removes the Windows title bar and this toolbar takes its place. The
       host hit-tests them (HTMINBUTTON etc.) and pushes hover/press state
       back, so they are drawn here but driven by Windows. -->
  <div class="caption" id="caption">
    <span class="capbtn" id="capMin" title="Minimize"></span>
    <span class="capbtn" id="capMax" title="Maximize"></span>
    <span class="capbtn" id="capClose" title="Close"></span>
  </div>
</header>

<div id="landing" class="hidden">
  <div class="landing-card">
    <div class="lside">
      <div class="lhead">
        <div class="hero" id="heroIcon"></div>
        <div class="lbrand">
          <h1>remark</h1>
          <p class="tagline">A discussion tool built on top of markdown — threads live in the file, conflict-free, in plain text.</p>
        </div>
        <button id="browseBtn" type="button"></button>
      </div>
      <form id="openForm">
        <input id="pathInput" placeholder="…or paste a path: D:\path\to\review.md" spellcheck="false">
        <button type="submit">Open</button>
      </form>
    </div>
    <div id="recent"></div>
  </div>
</div>

<main id="main" class="hidden mode-inline" tabindex="-1">
  <nav id="outline"></nav>
  <div id="docwrap">
    <article id="doc"></article>
    <div id="divider" title="Drag to resize · double-click to reset"></div>
    <aside id="rail"></aside>
  </div>
</main>

<div id="conflicts" class="hidden"></div>

<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/icons.js"></script>
<script src="/parser.js"></script>
<script src="/app.js"></script>
</body>
</html>
